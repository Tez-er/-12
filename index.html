!DOCTYPE html>
<html lang="uk" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TornadoLand — Затишний гриферський сервер Minecraft</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        tornado: {
                            50: '#faf5ff',
                            100: '#f3e8ff',
                            200: '#e9d5ff',
                            300: '#d8b4fe',
                            400: '#c084fc',
                            500: '#a855f7',
                            600: '#9333ea',
                            700: '#7e22ce',
                            800: '#6b21a8',
                            900: '#581c87',
                            950: '#3b0764',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'glow': 'glow 3s ease-in-out infinite alternate',
                        'shimmer': 'shimmer 2.5s infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        glow: {
                            '0%': { boxShadow: '0 0 15px rgba(168, 85, 247, 0.3)' },
                            '100%': { boxShadow: '0 0 35px rgba(168, 85, 247, 0.7)' },
                        },
                        shimmer: {
                            '100%': { transform: 'translateX(100%)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Стилізований скроллбар у фіолетових тонах */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #090314;
        }
        ::-webkit-scrollbar-thumb {
            background: #581c87;
            border-radius: 5px;
            border: 2px solid #090314;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9333ea;
        }
        /* Декоративна сітка на фоні */
        .bg-grid-pattern {
            background-image: radial-gradient(rgba(168, 85, 247, 0.12) 1px, transparent 1px);
            background-size: 28px 28px;
        }
        /* Minecraft Slot styling */
        .mc-slot {
            box-shadow: inset 2px 2px 0px #1a082b, inset -2px -2px 0px #5e289e;
        }
        .mc-slot:hover {
            box-shadow: inset 2px 2px 0px #310d52, inset -2px -2px 0px #9333ea, 0 0 12px rgba(168, 85, 247, 0.5);
        }
        .mc-container {
            box-shadow: 0 0 45px rgba(147, 51, 234, 0.35), inset 0 0 15px rgba(88, 28, 135, 0.5);
        }
        /* Градієнтна рамка для карток */
        .gradient-border {
            position: relative;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(30, 27, 75, 0.2), rgba(147, 51, 234, 0.15));
            border-radius: 1.5rem;
            padding: 1px;
        }
        .gradient-border-inner {
            background: rgba(15, 7, 32, 0.85);
            border-radius: 1.45rem;
            height: 100%;
        }
    </style>
</head>
<body class="bg-[#070210] text-slate-100 font-sans selection:bg-tornado-600 selection:text-white min-h-screen flex flex-col antialiased overflow-x-hidden">
    <!-- Шапка сайту (Navigation) -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-[#0c051d]/85 backdrop-blur-xl border-b border-tornado-900/40 shadow-lg shadow-black/40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            
            <!-- Логотип -->
            <a href="#hero" class="flex items-center gap-3 group">
                <div class="relative">
                    <div class="w-12 h-12 rounded-xl flex items-center justify-center shadow-lg group-hover:scale-105 transition-transform" style="background: linear-gradient(145deg, #4c1d95, #6d28d9, #7c3aed); box-shadow: 0 0 0 1px rgba(139,92,246,0.4), 0 4px 20px rgba(109,40,217,0.5);">
                        <i class="ph-fill ph-wind text-white text-2xl animate-spin" style="animation-duration: 12s;"></i>
                    <div class="w-12 h-12 rounded-xl flex items-center justify-center shadow-lg group-hover:scale-105 transition-transform" style="background: linear-gradient(145deg, #2d1060, #4c1d95, #3b0f7a); box-shadow: 0 0 0 1px rgba(109,40,217,0.5), 0 4px 24px rgba(76,29,149,0.6);">
                        <i class="ph-fill ph-axe text-white text-2xl"></i>
                    </div>
                </div>
                <div class="flex flex-col leading-tight">
</body>
</html>
